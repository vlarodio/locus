set -g default-shell /bin/bash
set -g default-command "bash --noprofile --rcfile /etc/locus/bashrc -i"
set -g default-terminal "screen-256color"
set -as terminal-features ",*:RGB"
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-titles on
set -g set-titles-string "locus | #W"
set -g status-interval 5
set -g status-position bottom
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 50
set -g status-left "#[fg=#181825,bg=#89b4fa,bold]  locus  #[fg=#cdd6f4,bg=#313244] #W #[fg=#181825,bg=#181825] "
set -g status-right-length 70
set -g status-right "#[fg=#181825,bg=#a6e3a1,bold] %H:%M #[fg=#cdd6f4,bg=#313244] %d.%m #[fg=#181825,bg=#181825] "
set -g window-status-style "fg=#7f849c,bg=#181825"
set -g window-status-current-style "fg=#181825,bg=#f5c2e7,bold"
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#f9e2af,fg=#181825,bold"
set -g mode-style "bg=#cba6f7,fg=#181825"
set -g clock-mode-colour "#89b4fa"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind R source-file /etc/locus/tmux.conf \; display-message "config reloaded"
